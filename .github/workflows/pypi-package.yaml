---
name: Build and upload PyPI package

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build-package:
    name: Build and verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@v3.0.2

  release-pypi:
    name: Upload package to pypi.org
    runs-on: ubuntu-latest
    needs: build-package
    environment: release
    steps:
      - name: Download packages built by previous step
        uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.7
      - name: Upload package to PyPI
        run: uv publish
